<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <title>Todo Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
    <style>
        .text-strikethrough {
            text-decoration: line-through;
            color: grey;
        }
    </style>
</head>

<body>
    <!-- container is like a box that holds all the content of your webpage and keeps it neatly centered on the screen. -->
    <div class="container">
        <h1 class="mt-5 text-center">Todo Application</h1>
        <!-- row : creates horizontal row for arranging columns ,mt-3 : adds margin to top -->
        <form action="/" method="post" class="row mt-3">
            <div class="col-md 10">
                <!-- form-control : to style input form,gives border and makes input larger than default size -->
                <input class="form-control form-control-lg" type="text" name="title" placeholder="Add a new task.."
                    required>

            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-solid theme-primary btn-lg btn-block">
                    Add
                </button>
            </div>
        </form>
        <!-- helps in iterating through each task -->
        <div class="mt-4">
            <th:block th:each="task : ${tasks}">
                <!-- create a card with a space below it -->
                <div class="card mb-2">
                    <!-- add padding inside the card,enables flexbox to arrange child elements in a row or col,distribute child ele and place space b/w them, alignment for child elements -->
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <span th:classappend="${task.completed} ? 'text-strikethrough'" th:text="${task.title}">Task
                            Title</span>
                        <div>
                            <a th:href="@{/{id}/toggle(id=${task.id})}"
                                class="btn btn-outline-secondary btn-sm">Toggle</a>
                            <!-- <a> tag defines element as hyperlink, and class="" makes link look like a small, outlined red button -->
                            <a th:href="@{/{id}/delete(id=${task.id})}" class="btn btn-outline-danger btn-sm">Delete</a>

                        </div>

                    </div>
                </div>

            </th:block>

        </div>


    </div>

</body>

</html>
